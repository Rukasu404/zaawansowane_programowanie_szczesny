name: PEP8

on:
  push:
  pull_request:

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pycodestyle
        run: pip install pycodestyle
      - name: Check PEP8
        run: pycodestyle --count --statistics .